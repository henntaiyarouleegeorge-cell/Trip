<style>
:root {

  --bg-paper: #FDFAFF;
  --ink: #2A1840;

* { box-sizing: border-box; margin: 0; padding: 0; }

body {

body::before {
  content: '';

  inset: 0;
  background:

.header {

  height: 3px;

.date-stamp {

.title-jp {

.title-en {

}

  font-family: var(--serif-en);

  font-style: italic;
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.progress-bar {
  height: 4px;
  background: var(--line-soft);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--sakura));
  border-radius: 2px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.timeline {
  position: relative;
  padding-left: 28px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 12px;
  bottom: 12px;
  width: 1px;
  background: linear-gradient(180deg, var(--line) 0%, var(--line) 90%, transparent 100%);

.empty-day {

  color: var(--ink-mute);
  font-size: 13px;
  font-style: italic;

.stop {
  position: relative;
  margin-bottom: 14px;
  background: var(--bg-paper);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  padding: 14px;
  transition: all 0.3s ease;
}

.stop.completed {
  opacity: 0.5;
  background: rgba(245, 239, 248, 0.5);
}

.stop.now {
  border-color: var(--accent);
  box-shadow: 0 4px 20px rgba(124, 101, 142, 0.2);
}

.stop-dot {
  position: absolute;
  left: -24px;
  top: 19px;
  width: 10px;
  height: 10px;
  background: var(--bg-base);
  border: 2px solid var(--ink-mute);
  border-radius: 50%;
  z-index: 2;
  transition: all 0.3s ease;
}

.stop.completed .stop-dot {
  background: var(--accent);
  border-color: var(--accent);
}

.stop.now .stop-dot {
  background: var(--accent);
  border-color: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}

.stop-title {

.stop-meta {

.stop-desc {

.footer {

const STORAGE_TRIPS = 'osaka_trip_data_v1';
const STORAGE_PROGRESS = 'osaka_trip_progress_v1';
const STORAGE_CURRENT_DAY = 'osaka_trip_current_day_v1';

let trips = loadTrips();
let progress = loadProgress();
let currentDay = loadCurrentDay();
let editingStop = null;

function loadTrips() {
  try {
    const raw = localStorage.getItem(STORAGE_TRIPS);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_TRIPS));
}

function saveTrips() {
  try {
    localStorage.setItem(STORAGE_TRIPS, JSON.stringify(trips));
  } catch (e) {
    showToast('儲存失敗、空間不足');
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_PROGRESS);
    if (!raw) return {};
    const p = JSON.parse(raw);
    return (typeof p === 'object' && p !== null) ? p : {};
  } catch (e) { return {}; }
}

function saveProgress() {
  try { localStorage.setItem(STORAGE_PROGRESS, JSON.stringify(progress)); } catch (e) {}
}

function loadCurrentDay() {
  try {
    const d = localStorage.getItem(STORAGE_CURRENT_DAY);
    return d && trips[d] ? d : 'day1';
  } catch (e) { return 'day1'; }
}

function saveCurrentDay() {
  try { localStorage.setItem(STORAGE_CURRENT_DAY, currentDay); } catch (e) {}
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      showToast('已複製 ' + label);
      return;
    } catch (e) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(ok ? '已複製 ' + label : '複製失敗');
  } catch (e) {
    showToast('複製失敗');
  }
}

function openMaps(query) {
  if (!query) {
    showToast('沒有導航資料');
    return;
  }
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  window.open(url, '_blank', 'noopener,noreferrer');
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  if (!container) return;
  container.innerHTML = '';
  const keys = Object.keys(trips);
  keys.forEach(key => {
    const day = trips[key];
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (currentDay === key ? ' active' : '');
    btn.dataset.day = key;
    const parts = day.label.split(' ');
    btn.innerHTML = '<span class="day-tab-date">' + parts[0] + '</span><span class="day-tab-label">' + (parts[1] || '') + '</span>';
    btn.addEventListener('click', () => switchDay(key));
    container.appendChild(btn);
  });
}

function switchDay(key) {
  if (!trips[key]) return;
  currentDay = key;
  saveCurrentDay();
  renderDayTabs();
  renderTimeline();
}

function renderTimeline() {
  const container = document.getElementById('timeline');
  if (!container) return;
  const day = trips[currentDay];
  if (!day || !day.stops || day.stops.length === 0) {
    container.innerHTML = '<div class="empty-day">今天還沒有景點<br>點下方「＋ 新增景點」開始吧</div>';
    updateProgress();
    updateNowCard();
    return;
  }

  const sortedStops = day.stops.slice().sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

  const frag = document.createDocumentFragment();

  sortedStops.forEach(stop => {
    const isCompleted = !!progress[stop.id];

    const article = document.createElement('article');
    article.className = 'stop' + (isCompleted ? ' completed' : '');
    article.dataset.id = stop.id;

    const dot = document.createElement('div');
    dot.className = 'stop-dot';
    article.appendChild(dot);

    const header = document.createElement('div');
    header.className = 'stop-header';

    const time = document.createElement('div');
    time.className = 'stop-time';
    time.textContent = stop.time || '--:--';
    header.appendChild(time);

    const check = document.createElement('button');
    check.className = 'stop-check';
    check.setAttribute('aria-label', '標記完成');
    check.innerHTML = '✓';
    check.addEventListener('click', () => toggleComplete(stop.id));
    header.appendChild(check);

    article.appendChild(header);

    if (stop.title) {
      const title = document.createElement('h2');
      title.className = 'stop-title';
      title.textContent = stop.title;
      article.appendChild(title);
    }

    if (stop.titleSub) {
      const sub = document.createElement('div');
      sub.className = 'stop-title-sub';
      sub.textContent = stop.titleSub;
      article.appendChild(sub);
    }

    if (stop.tags && stop.tags.length > 0) {
      const meta = document.createElement('div');
      meta.className = 'stop-meta';
      stop.tags.forEach(t => {
        const tag = document.createElement('span');
        let cls = 'tag';
        if (t.indexOf('世界遺產') !== -1 || t.indexOf('預約') !== -1) cls += ' gold';
        else if (t.indexOf('無五辛') !== -1) cls += ' red';
        tag.className = cls;
        tag.textContent = t;
        meta.appendChild(tag);
      });
      article.appendChild(meta);
    }

    if (stop.desc) {
      const desc = document.createElement('p');
      desc.className = 'stop-desc';
      desc.textContent = stop.desc;
      article.appendChild(desc);
    }

    if (stop.address || stop.mapsQuery) {
      const actions = document.createElement('div');
      actions.className = 'actions';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn';
      copyBtn.innerHTML = '<span class="btn-icon">⊕</span><span>複製地址</span>';
      copyBtn.addEventListener('click', () => {
        if (stop.address) copyText(stop.address, '地址');
        else showToast('沒有地址資料');
      });
      actions.appendChild(copyBtn);

      const mapBtn = document.createElement('button');
      mapBtn.className = 'btn primary';
      mapBtn.innerHTML = '<span class="btn-icon">▷</span><span>導航</span>';
      mapBtn.addEventListener('click', () => openMaps(stop.mapsQuery));
      actions.appendChild(mapBtn);

      article.appendChild(actions);
    }

    const controls = document.createElement('div');
    controls.className = 'stop-controls';

    const editBtn = document.createElement('button');
    editBtn.className = 'stop-ctrl-btn';
    editBtn.textContent = '✎ 編輯';
    editBtn.addEventListener('click', () => openEditModal(stop.id));
    controls.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'stop-ctrl-btn danger';
    delBtn.textContent = '✕ 刪除';
    delBtn.addEventListener('click', () => deleteStop(stop.id));
    controls.appendChild(delBtn);

    article.appendChild(controls);
    frag.appendChild(article);
  });

  container.innerHTML = '';
  container.appendChild(frag);
  updateProgress();
  updateNowCard();
}

function updateProgress() {
  const day = trips[currentDay];
  if (!day) return;
  const total = day.stops.length;
  const done = day.stops.filter(s => progress[s.id]).length;
  const pct = total > 0 ? (done / total) * 100 : 0;
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  const lbl = document.getElementById('progressDay');
  if (fill) fill.style.width = pct + '%';
  if (text) text.textContent = done + ' / ' + total;
  if (lbl) lbl.textContent = (day.label || currentDay).toUpperCase() + ' PROGRESS';
}

function toggleComplete(id) {
  progress[id] = !progress[id];
  if (!progress[id]) delete progress[id];
  saveProgress();
  const el = document.querySelector('.stop[data-id="' + id + '"]');
  if (el) el.classList.toggle('completed', !!progress[id]);
  updateProgress();
  updateNowCard();
}

function timeToMinutes(t) {
  if (!t) return 0;
  const parts = t.split(':').map(Number);
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return 0;
  return parts[0] * 60 + parts[1];
}

function updateNowCard() {
  const contentEl = document.getElementById('nowContent');
  const timeEl = document.getElementById('nowTime');
  if (!contentEl || !timeEl) return;

  const now = new Date();
  const todayStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  let todayKey = null;
  Object.keys(trips).forEach(k => {
    if (trips[k].date === todayStr) todayKey = k;
  });

  const day = trips[currentDay];
  if (!day) return;

  if (!todayKey) {
    const futureDays = Object.values(trips).filter(d => d.date > todayStr).sort((a, b) => a.date.localeCompare(b.date));
    if (futureDays.length > 0) {
      const target = new Date(futureDays[0].date + 'T09:00:00+09:00');
      const diff = target - now;
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      contentEl.textContent = '準備出發 · ' + futureDays[0].label;
      timeEl.textContent = days > 0 ? ('還有 ' + days + ' 天 ' + hours + ' 小時') : ('還有 ' + hours + ' 小時');
    } else {
      contentEl.textContent = '行程已結束 · 平安回家 💜';
      timeEl.textContent = '';
    }
    return;
  }

  if (currentDay !== todayKey) {
    contentEl.innerHTML = '查看：<strong>' + day.label + '</strong>';
    timeEl.textContent = '今天是 ' + trips[todayKey].label;
    return;
  }

  const nowMins = now.getHours() * 60 + now.getMinutes();
  const sortedStops = day.stops.slice().sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

  let curr = null;
  let next = null;
  for (let i = 0; i < sortedStops.length; i++) {
    const s = sortedStops[i];
    const startMins = timeToMinutes(s.time);
    const endMins = startMins + (s.duration || 60);
    if (nowMins >= startMins && nowMins < endMins) {
      curr = s;
      next = sortedStops[i + 1] || null;
      break;
    }
    if (nowMins < startMins) {
      next = s;
      break;
    }
  }

  document.querySelectorAll('.stop').forEach(el => el.classList.remove('now'));

  if (curr) {
    contentEl.innerHTML = '現在：<strong>' + curr.title + '</strong>';
    const endMins = timeToMinutes(curr.time) + (curr.duration || 60);
    const endH = Math.floor(endMins / 60);
    const endM = endMins % 60;
    const endStr = String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0');
    const nextInfo = next ? '　·　下一站 ' + next.time + ' ' + next.title : '';
    timeEl.textContent = '預計到 ' + endStr + nextInfo;
    const t = document.querySelector('.stop[data-id="' + curr.id + '"]');
    if (t) t.classList.add('now');
  } else if (next) {
    contentEl.innerHTML = '即將前往：<strong>' + next.title + '</strong>';
    timeEl.textContent = next.time + ' 出發';
    const t = document.querySelector('.stop[data-id="' + next.id + '"]');
    if (t) t.classList.add('now');
  } else {
    contentEl.textContent = '今日行程結束 · 回飯店 💜';
    timeEl.textContent = '辛苦了';
  }
}

}

function openEditModal(stopId) {
  const day = trips[currentDay];
  if (!day) return;
  const stop = day.stops.find(s => s.id === stopId);
  if (!stop) return;
  editingStop = { dayKey: currentDay, stopId: stopId };
  document.getElementById('modalTitle').textContent = '編輯景點';
  document.getElementById('fTime').value = stop.time || '';
  document.getElementById('fTitle').value = stop.title || '';
  document.getElementById('fTitleSub').value = stop.titleSub || '';
  document.getElementById('fDesc').value = stop.desc || '';
  document.getElementById('fAddress').value = stop.address || '';
  document.getElementById('fMapsQuery').value = stop.mapsQuery || '';
  document.getElementById('fTags').value = (stop.tags || []).join(', ');
  showModal();
}

function showModal() {
  document.getElementById('modalBackdrop').classList.add('show');
}

function hideModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
  editingStop = null;
}

function validateTimeFormat(t) {
  if (!t) return false;
  return /^([01]?\d|2[0-3]):[0-5]\d$/.test(t);
}

function saveStop() {
  const time = document.getElementById('fTime').value.trim();
  const title = document.getElementById('fTitle').value.trim();

  if (!title) {
    showToast('請填名稱');
    return;
  }
  if (time && !validateTimeFormat(time)) {
    showToast('時間格式：HH:MM');
    return;
  }

  const tagsRaw = document.getElementById('fTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(/[,、，]/).map(t => t.trim()).filter(Boolean) : [];

  const stopData = {
    time: time || '00:00',
    title: title,
    titleSub: document.getElementById('fTitleSub').value.trim(),
    desc: document.getElementById('fDesc').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    mapsQuery: document.getElementById('fMapsQuery').value.trim(),
    tags: tags,
    duration: 60
  };

  if (editingStop) {
    const day = trips[editingStop.dayKey];
    if (day) {
      const idx = day.stops.findIndex(s => s.id === editingStop.stopId);
      if (idx !== -1) {
        Object.assign(day.stops[idx], stopData);
      }
    }
    showToast('已更新');
  } else {
    stopData.id = 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    trips[currentDay].stops.push(stopData);
    showToast('已新增');
  }

  saveTrips();
  hideModal();
  renderTimeline();
}

function deleteStop(stopId) {
  if (!confirm('確定要刪除這個景點嗎？')) return;
  const day = trips[currentDay];
  if (!day) return;
  day.stops = day.stops.filter(s => s.id !== stopId);
  if (progress[stopId]) {
    delete progress[stopId];
    saveProgress();
  }
  saveTrips();
  renderTimeline();
  showToast('已刪除');
}

function exportData() {
  const data = {
    trips: trips,
    progress: progress,
    exportedAt: new Date().toISOString()
  };
  const json = JSON.stringify(data, null, 2);
  copyText(json, '完整資料 JSON');
}

function importData() {
  const txt = prompt('貼上之前匯出的 JSON：');
  if (!txt) return;
  try {
    const data = JSON.parse(txt);
    if (!data || !data.trips) {
      showToast('資料格式錯誤');
      return;
    }
    if (!confirm('確定要覆蓋現有資料嗎？')) return;
    trips = data.trips;
    progress = data.progress || {};
    saveTrips();
    saveProgress();
    renderDayTabs();
    renderTimeline();
    showToast('已匯入');
  } catch (e) {
    showToast('JSON 格式錯誤');
  }
}

function resetAll() {
  if (!confirm('要重設成預設行程嗎？所有自訂景點與打勾會消失。')) return;
  trips = JSON.parse(JSON.stringify(DEFAULT_TRIPS));
  progress = {};
  saveTrips();
  saveProgress();
  renderDayTabs();
  renderTimeline();
  showToast('已重設');
}

document.getElementById('addStopBtn').addEventListener('click', openAddModal);
document.getElementById('modalCancel').addEventListener('click', hideModal);
document.getElementById('modalSave').addEventListener('click', saveStop);
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) hideModal();
});
document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importBtn').addEventListener('click', importData);
document.getElementById('resetBtn').addEventListener('click', resetAll);

function init() {
  try {
    renderDayTabs();
    renderTimeline();
    setInterval(updateNowCard, 60000);
  } catch (e) {
    console.error('Init failed:', e);
    document.getElementById('timeline').innerHTML =
      '<p style="text-align:center;padding:20px;color:#999;">載入失敗、請重新整理</p>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
