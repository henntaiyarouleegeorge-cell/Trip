.now-card::before {

.progress-wrap {

.progress-bar {

.progress-fill {

.timeline {

.stop.featured {

@keyframes pulse {

const STORAGE_KEY = 'kyoto_5_29_progress_v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (typeof parsed === 'object' && parsed !== null) ? parsed : {};
  } catch (e) {
    return {};
  }
}

function saveProgress(p) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  } catch (e) {}
}

let progress = loadProgress();
let toastTimer = null;

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}

async function copyText(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      showToast('已複製 ' + label);
      return;
    } catch (e) {}
  }
  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '0';
    textarea.setAttribute('readonly', '');
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(textarea);
    if (ok) {
      showToast('已複製 ' + label);
    } else {
      showToast('複製失敗、請手動複製');
    }
  } catch (e) {
    showToast('複製失敗、請手動複製');
  }
}

function openMaps(query) {
  const encoded = encodeURIComponent(query);
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encoded;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function renderTimeline() {
  const container = document.getElementById('timeline');
  if (!container) return;
  const frag = document.createDocumentFragment();

  STOPS.forEach((stop, idx) => {
    const isCompleted = !!progress[stop.id];
    const isFeatured = !!stop.featured;

    const article = document.createElement('article');
    article.className = 'stop' + (isCompleted ? ' completed' : '') + (isFeatured ? ' featured' : '');
    article.dataset.id = stop.id;
    article.dataset.index = idx;

    const dot = document.createElement('div');
    dot.className = 'stop-dot';
    article.appendChild(dot);

    const header = document.createElement('div');
    header.className = 'stop-header';

    const time = document.createElement('div');
    time.className = 'stop-time';
    time.textContent = stop.time;
    header.appendChild(time);

    const check = document.createElement('button');
    check.className = 'stop-check';
    check.setAttribute('aria-label', '標記完成');
    check.innerHTML = '✓';
    check.addEventListener('click', () => toggleComplete(stop.id));
    header.appendChild(check);

    article.appendChild(header);

    if (isFeatured) {
      const badge = document.createElement('div');
      badge.className = 'featured-badge';
      badge.textContent = '驚 喜';
      article.appendChild(badge);
    }

    const title = document.createElement('h2');
    title.className = 'stop-title';
    title.textContent = stop.title;
    article.appendChild(title);

    const titleSub = document.createElement('div');
    titleSub.className = 'stop-title-sub';
    titleSub.textContent = stop.titleSub;
    article.appendChild(titleSub);

    const meta = document.createElement('div');
    meta.className = 'stop-meta';
    stop.tags.forEach(t => {
      const tag = document.createElement('span');
      let cls = 'tag';
      if (t.indexOf('💍') !== -1) cls += ' red';
      else if (t.indexOf('世界遺產') !== -1 || t.indexOf('預約') !== -1) cls += ' gold';
      tag.className = cls;
      tag.textContent = t;
      meta.appendChild(tag);
    });
    article.appendChild(meta);

    const desc = document.createElement('p');
    desc.className = 'stop-desc';
    desc.textContent = stop.desc;
    article.appendChild(desc);

    if (stop.surprise) {
      const hint = document.createElement('div');
      hint.className = 'surprise-hint';
      hint.textContent = stop.surprise;
      article.appendChild(hint);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn';
    copyBtn.innerHTML = '<span class="btn-icon">⊕</span><span>複製地址</span>';
    copyBtn.addEventListener('click', () => copyText(stop.address, '地址'));
    actions.appendChild(copyBtn);

    const mapBtn = document.createElement('button');
    mapBtn.className = 'btn primary';
    mapBtn.innerHTML = '<span class="btn-icon">▷</span><span>導航</span>';
    mapBtn.addEventListener('click', () => openMaps(stop.mapsQuery));
    actions.appendChild(mapBtn);

    article.appendChild(actions);
    frag.appendChild(article);
  });

  container.innerHTML = '';
  container.appendChild(frag);
  updateProgress();
  updateNowCard();
}

function updateProgress() {
  const total = STOPS.length;
  const done = STOPS.filter(s => progress[s.id]).length;
  const pct = total > 0 ? (done / total) * 100 : 0;
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  if (fill) fill.style.width = pct + '%';
  if (text) text.textContent = done + ' / ' + total;
}

function toggleComplete(id) {
  progress[id] = !progress[id];
  if (!progress[id]) delete progress[id];
  saveProgress(progress);
  const stop = document.querySelector('.stop[data-id="' + id + '"]');
  if (stop) {
    stop.classList.toggle('completed', !!progress[id]);
  }
  updateProgress();
  updateNowCard();
}

function timeToMinutes(timeStr) {
  const parts = timeStr.split(':').map(Number);
  return parts[0] * 60 + parts[1];
}

function updateNowCard() {
  const contentEl = document.getElementById('nowContent');
  const timeEl = document.getElementById('nowTime');
  if (!contentEl || !timeEl) return;

  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const todayStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  const isTargetDay = todayStr === '2026-05-29';

  if (!isTargetDay) {
    const target = new Date('2026-05-29T09:00:00+09:00');
    const diff = target - now;
    if (diff > 0) {
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      contentEl.textContent = '準備出發 · 5/29 早上 09:00 從飯店前往京都';
      timeEl.textContent = '還有 ' + days + ' 天 ' + hours + ' 小時';
    } else {
      contentEl.textContent = '行程已結束 · 平安回到大阪 💜';
      timeEl.textContent = '';
    }
    return;
  }

  let currentStop = null;
  let nextStop = null;

  for (let i = 0; i < STOPS.length; i++) {
    const stop = STOPS[i];
    const startMins = timeToMinutes(stop.time);
    const endMins = startMins + stop.duration;
    if (nowMins >= startMins && nowMins < endMins) {
      currentStop = stop;
      nextStop = STOPS[i + 1] || null;
      break;
    }
    if (nowMins < startMins) {
      nextStop = stop;
      break;
    }
  }

  if (currentStop) {
    contentEl.innerHTML = '現在：<strong>' + currentStop.title + '</strong>';
    const endMins = timeToMinutes(currentStop.time) + currentStop.duration;
    const endH = Math.floor(endMins / 60);
    const endM = endMins % 60;
    const endStr = String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0');
    const nextInfo = nextStop ? '　·　下一站 ' + nextStop.time + ' ' + nextStop.title : '';
    timeEl.textContent = '預計到 ' + endStr + nextInfo;
    document.querySelectorAll('.stop').forEach(el => el.classList.remove('now'));
    const targetEl = document.querySelector('.stop[data-id="' + currentStop.id + '"]');
    if (targetEl) targetEl.classList.add('now');
  } else if (nextStop) {
    contentEl.innerHTML = '即將前往：<strong>' + nextStop.title + '</strong>';
    timeEl.textContent = nextStop.time + ' 出發';
    document.querySelectorAll('.stop').forEach(el => el.classList.remove('now'));
    const targetEl = document.querySelector('.stop[data-id="' + nextStop.id + '"]');
    if (targetEl) targetEl.classList.add('now');
  } else {
    contentEl.textContent = '行程結束 · 回飯店 💜';
    timeEl.textContent = '辛苦了';
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('要重設所有打勾嗎？')) {
    progress = {};
    saveProgress(progress);
    renderTimeline();
    showToast('已重設');
  }
});

function init() {
  try {
    renderTimeline();
    setInterval(updateNowCard, 60000);
  } catch (e) {
    document.getElementById('timeline').innerHTML =
      '<p style="text-align:center;padding:20px;color:#999;">載入失敗、請重新整理</p>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
